name: Signelya landing validation

on:
  push:
    branches:
      - feature/signelya-landing-20260903
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signelya-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate new Signelya components
        run: npm exec -- eslint src/pages/signelya/SignelyaLanding.jsx src/pages/signelya/SignelyaLegal.jsx --max-warnings=0
      - name: Test Signelya and Pixelium isolation
        run: node --test tests/signelya-landing.test.cjs
      - name: Build production bundle
        run: npm run build
      - name: Verify patch integrity
        run: git diff --check
