name: Companion lint autofix

on:
  push:
    branches:
      - agent/finish-public-companion

permissions:
  contents: write

concurrency:
  group: companion-lint-autofix
  cancel-in-progress: true

jobs:
  autofix:
    name: Remove unused imports safely
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/finish-public-companion
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply ESLint safe fixes
        run: npm run lint:fix

      - name: Verify patch integrity
        run: git diff --check

      - name: Commit automatic lint fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No automatic lint fixes required."
            exit 0
          fi
          git config user.name "jsinnovia-ci"
          git config user.email "info@jsinnovia.com"
          git add src
          git commit -m "chore: apply safe ESLint import fixes"
          git push origin HEAD:agent/finish-public-companion
