name: Dependency safe autofix

on:
  push:
    branches:
      - agent/finish-public-companion

permissions:
  contents: write

concurrency:
  group: dependency-safe-autofix
  cancel-in-progress: true

jobs:
  update:
    name: Apply non-breaking npm security fixes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: agent/finish-public-companion
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking dependency fixes
        shell: bash
        run: npm audit fix || true

      - name: Run companion tests
        run: npm test

      - name: Validate companion source
        run: npm exec -- eslint src/components/chatbot/AIAvatar.jsx src/components/chatbot/AIChatbot.jsx --max-warnings=0

      - name: Run repository ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Verify patch integrity
        run: git diff --check

      - name: Commit verified dependency updates
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No non-breaking dependency update is available."
            exit 0
          fi
          git config user.name "jsinnovia-ci"
          git config user.email "info@jsinnovia.com"
          git add package.json package-lock.json
          git commit -m "chore: apply verified non-breaking dependency fixes"
          git push origin HEAD:agent/finish-public-companion
